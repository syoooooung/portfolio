<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <style>
    .box{fill:#1c0a1b;stroke:rgba(244,238,245,.28);rx:3}
    .llm{stroke:#ff5a1f}
    .lbl{fill:#f4eef5;font-size:13px}
    .sub{fill:#b9a8bd;font-size:10px}
    .tag{fill:#ff5a1f;font-size:9px;letter-spacing:.12em}
    .arrow{stroke:#b9a8bd;stroke-width:1.2;fill:none;marker-end:url(#a)}
    .lane{fill:#b9a8bd;font-size:9px;letter-spacing:.18em}
  </style>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0L7 3.5L0 7Z" fill="#b9a8bd"/></marker></defs>
  <rect width="880" height="300" fill="#120211"/>

  <text class="lane" x="20" y="30">AI PIPELINE</text>
  <g>
    <rect class="box" x="20"  y="60" width="130" height="64" rx="3"/>
    <text class="lbl" x="34" y="88">LCA 보고서</text><text class="sub" x="34" y="106">PDF 업로드</text>
    <rect class="box" x="190" y="60" width="130" height="64" rx="3"/>
    <text class="lbl" x="204" y="88">파싱·구조화</text><text class="sub" x="204" y="106">표·수치 검증</text>
    <rect class="box llm" x="360" y="60" width="130" height="64" rx="3"/>
    <text class="tag" x="374" y="76">LLM</text>
    <text class="lbl" x="374" y="94">핫스팟 추출</text><text class="sub" x="374" y="110">배출 기여 공정</text>
    <rect class="box llm" x="530" y="60" width="140" height="64" rx="3"/>
    <text class="tag" x="544" y="76">LLM · Structured</text>
    <text class="lbl" x="544" y="94">개선 시나리오</text><text class="sub" x="544" y="110">감축안 생성</text>
    <rect class="box llm" x="710" y="60" width="150" height="64" rx="3"/>
    <text class="tag" x="724" y="76">Agent</text>
    <text class="lbl" x="724" y="94">ISO 준수 검토</text><text class="sub" x="724" y="110">14040·14044·14067</text>
    <path class="arrow" d="M150 92H184"/><path class="arrow" d="M320 92H354"/>
    <path class="arrow" d="M490 92H524"/><path class="arrow" d="M670 92H704"/>
  </g>

  <text class="lane" x="20" y="185">SERVING</text>
  <g>
    <rect class="box" x="20" y="205" width="180" height="60" rx="3"/>
    <text class="lbl" x="34" y="231">FastAPI</text><text class="sub" x="34" y="249">PostgreSQL · SQLModel</text>
    <rect class="box" x="280" y="205" width="180" height="60" rx="3"/>
    <text class="lbl" x="294" y="231">LiteLLM Proxy</text><text class="sub" x="294" y="249">OpenAI 호환 추상화</text>
    <rect class="box" x="560" y="196" width="140" height="34" rx="3"/>
    <text class="sub" x="574" y="218" fill="#f4eef5">클라우드 LLM API</text>
    <rect class="box" x="560" y="240" width="140" height="34" rx="3"/>
    <text class="sub" x="574" y="262" fill="#f4eef5">온프레미스 vLLM</text>
    <path class="arrow" d="M200 235H274"/>
    <path class="arrow" d="M460 228 Q510 213 554 213"/>
    <path class="arrow" d="M460 242 Q510 257 554 257"/>
    <text class="sub" x="720" y="232">코드 변경 없이</text>
    <text class="sub" x="720" y="246">전환 (폐쇄망 대응)</text>
  </g>
</svg>
