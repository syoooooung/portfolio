<svg viewBox="0 0 880 350" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <style>
    .lbl{fill:#f4eef5;font-size:12px}
    .sub{fill:#b9a8bd;font-size:10px}
    .lane{fill:#b9a8bd;font-size:9px;letter-spacing:.18em}
    .arrow{stroke:#b9a8bd;stroke-width:1.2;fill:none;marker-end:url(#a3)}
    .box{fill:#1c0a1b;stroke:rgba(244,238,245,.28)}
    .mine{stroke:#ff5a1f;stroke-width:1.5}
    .team{stroke:rgba(244,238,245,.28);stroke-dasharray:4 3}
  </style>
  <defs><marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0L7 3.5L0 7Z" fill="#b9a8bd"/></marker></defs>
  <rect width="880" height="350" fill="#120211"/>

  <text class="lane" x="20" y="26" fill="#ff5a1f">EPQD — 내 담당 (의미 보존 질문 분해)</text>
  <rect x="20" y="38" width="560" height="150" rx="4" fill="none" stroke="rgba(255,90,31,.35)"/>

  <rect class="box" x="36" y="58" width="150" height="56" rx="3"/>
  <text class="lbl" x="50" y="82">원 질문</text>
  <text class="sub" x="50" y="99">멀티문서 · 복합 질문</text>

  <rect class="box mine" x="222" y="58" width="150" height="56" rx="3"/>
  <text class="lbl" x="236" y="79">① 의미 분할</text>
  <text class="sub" x="236" y="95">접속사·쉼표 기준</text>
  <text class="sub" x="236" y="107">(따옴표 구간 예외)</text>

  <rect class="box mine" x="408" y="58" width="156" height="56" rx="3"/>
  <text class="lbl" x="422" y="79">② 서브질문 생성</text>
  <text class="sub" x="422" y="95">각 phrase + 원문 동반</text>
  <text class="sub" x="422" y="107">phrase당 1개 · 용어 보존</text>

  <path class="arrow" d="M186 86H216"/><path class="arrow" d="M372 86H402"/>
  <text class="sub" x="36" y="146">→ 엔티티 누락률(EOR) <tspan fill="#ff5a1f">70.2% → 7.4%</tspan> (복잡 질문, LangChain QD 대비)</text>
  <text class="sub" x="36" y="164">→ 불필요 엔티티 추가(EAR)도 47.3% → 14.4%로 감소 — 분해가 질문을 바꾸지 않게</text>

  <text class="lane" x="20" y="230">DICS — 팀 설계 (동적 입력 컨텍스트 선택)</text>
  <rect x="20" y="242" width="560" height="88" rx="4" fill="none" stroke="rgba(244,238,245,.18)"/>
  <rect class="box team" x="36" y="258" width="160" height="56" rx="3"/>
  <text class="sub" x="50" y="280" fill="#f4eef5">질문 그래프 → Core 노드</text>
  <text class="sub" x="50" y="296">선택 기준(criteria) 도출</text>
  <rect class="box team" x="232" y="258" width="170" height="56" rx="3"/>
  <text class="sub" x="246" y="280" fill="#f4eef5">GS 모델 (GAT 그래프 임베딩)</text>
  <text class="sub" x="246" y="296">기준당 청크 1개 선택</text>
  <rect class="box team" x="438" y="258" width="126" height="56" rx="3"/>
  <text class="sub" x="452" y="280" fill="#f4eef5">동적 입력 컨텍스트</text>
  <text class="sub" x="452" y="296">top-K 고정 폐기</text>
  <path class="arrow" d="M196 286H226"/><path class="arrow" d="M402 286H432"/>

  <path class="arrow" d="M564 114 Q640 150 620 252 Q615 275 570 286"/>
  <text class="sub" x="640" y="170">서브질문별 검색 →</text>

  <rect class="box" x="700" y="120" width="160" height="90" rx="3"/>
  <text class="lbl" x="714" y="148">LLM 답변 생성</text>
  <text class="sub" x="714" y="168">입력 청크 8.6 → 4.0</text>
  <text class="sub" x="714" y="184">F1 0.596 → 0.877</text>
  <path class="arrow" d="M570 300 Q680 300 720 216"/>
</svg>
