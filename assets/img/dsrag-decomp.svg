<svg viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <style>
    .lbl{fill:#f4eef5;font-size:12px}
    .sub{fill:#b9a8bd;font-size:10px}
    .lane{fill:#b9a8bd;font-size:9px;letter-spacing:.18em}
    .edge{stroke:rgba(244,238,245,.35);stroke-width:1.2;fill:none}
    .arrow{stroke:#b9a8bd;stroke-width:1.2;fill:none;marker-end:url(#a2)}
    .node{fill:#1c0a1b;stroke:rgba(244,238,245,.4)}
    .core{fill:rgba(255,90,31,.15);stroke:#ff5a1f;stroke-width:1.6}
    .dup{stroke:#e0117a;stroke-dasharray:4 3}
  </style>
  <defs><marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0L7 3.5L0 7Z" fill="#b9a8bd"/></marker></defs>
  <rect width="880" height="330" fill="#120211"/>

  <text class="lane" x="20" y="30">1 · 질문</text>
  <rect x="20" y="45" width="200" height="70" rx="3" fill="#1c0a1b" stroke="rgba(244,238,245,.28)"/>
  <text class="sub" x="34" y="72" fill="#f4eef5">"A가 설립한 회사가 인수한</text>
  <text class="sub" x="34" y="88" fill="#f4eef5">스튜디오의 첫 작품은?"</text>
  <text class="sub" x="34" y="106">멀티홉 질문</text>

  <text class="lane" x="290" y="30">2 · 엔티티·관계 그래프</text>
  <g>
    <circle class="node" cx="330" cy="80" r="18"/><text class="lbl" x="330" y="84" text-anchor="middle">A</text>
    <circle class="core" cx="420" cy="110" r="22"/><text class="lbl" x="420" y="114" text-anchor="middle">회사</text>
    <circle class="node" cx="510" cy="80" r="24"/><text class="sub" x="510" y="84" text-anchor="middle" fill="#f4eef5">스튜디오</text>
    <circle class="node" cx="560" cy="150" r="20"/><text class="sub" x="560" y="154" text-anchor="middle" fill="#f4eef5">작품</text>
    <path class="edge" d="M346 88 L400 102"/><path class="edge" d="M441 100 L488 87"/><path class="edge" d="M524 98 L552 132"/>
    <text class="sub" x="336" y="108">설립</text><text class="sub" x="446" y="76">인수</text><text class="sub" x="530" y="120">제작</text>
    <text class="sub" x="330" y="166" fill="#ff5a1f">Core 노드 — 연결 중심도·루트 거리 기준</text>
  </g>

  <text class="lane" x="20" y="215">3 · 의미 보존 서브쿼리 (Core 복제 포함)</text>
  <g>
    <rect x="20" y="230" width="260" height="56" rx="3" fill="#1c0a1b" stroke="rgba(244,238,245,.28)"/>
    <circle class="core" cx="46" cy="258" r="12"/><text class="sub" x="68" y="255" fill="#f4eef5">SQ1 · A가 설립한 회사는?</text>
    <text class="sub" x="68" y="271">→ 회사 = X</text>
    <rect x="310" y="230" width="280" height="56" rx="3" fill="#1c0a1b" stroke="rgba(244,238,245,.28)"/>
    <circle class="core dup" cx="336" cy="258" r="12" fill="rgba(255,90,31,.15)"/>
    <text class="sub" x="358" y="255" fill="#f4eef5">SQ2 · X가 인수한 스튜디오의</text>
    <text class="sub" x="358" y="271" fill="#f4eef5">첫 작품은? (Core 복제)</text>
  </g>
  <path class="arrow" d="M230 115 Q260 150 240 224"/>
  <path class="arrow" d="M480 180 Q460 205 450 224"/>

  <text class="lane" x="660" y="215">4 · RETRIEVAL</text>
  <rect x="660" y="230" width="190" height="56" rx="3" fill="#1c0a1b" stroke="rgba(244,238,245,.28)"/>
  <text class="sub" x="674" y="255" fill="#f4eef5">서브쿼리별 병렬 검색</text>
  <text class="sub" x="674" y="271">→ 멀티홉 연결 유지</text>
  <path class="arrow" d="M590 258 H654"/>
</svg>
